server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxies to the "app" service's internal container port (8080), not its host-mapped port -
    # this only runs inside the docker-compose network.
    location /api/ {
        proxy_pass http://app:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing (React Router) - unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
