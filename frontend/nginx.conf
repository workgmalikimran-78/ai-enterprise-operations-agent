server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS (127.0.0.11) with a short TTL, and the upstream as a variable in
    # proxy_pass - this forces nginx to re-resolve "app" on every request instead of caching
    # whatever IP it had at startup. Without this, restarting/recreating the app container alone
    # (its IP changes) leaves nginx proxying to a dead IP until nginx itself is restarted.
    resolver 127.0.0.11 valid=10s;

    # Proxies to the "app" service's internal container port (8080), not its host-mapped port -
    # this only runs inside the docker-compose network.
    location /api/ {
        # Matches the backend's spring.servlet.multipart.max-file-size - nginx's 1MB default
        # would otherwise reject log file uploads with a 413 before they ever reach the app.
        client_max_body_size 10M;
        set $upstream_app app:8080;
        # proxy_pass with a variable in the authority disables nginx's usual "replace the
        # matched location prefix" rewriting - $request_uri must be appended explicitly, or
        # every request collapses to the literal path written here ("/api/", dropping the rest).
        proxy_pass http://$upstream_app$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing (React Router) - unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
