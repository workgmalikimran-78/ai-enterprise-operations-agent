services:
  postgres:
    image: postgres:16-alpine
    container_name: aiops-postgres
    environment:
      POSTGRES_DB: aiops
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: aiops
    ports:
      - "5433:5432"
    volumes:
      - aiops-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops -d aiops"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aiops-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: aiops-kafka
    ports:
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two advertised listeners: INTERNAL for other containers (app service), EXTERNAL for the
      # host machine (e.g. running the backend locally via an IDE against the dockerized infra).
      # A single listener can't satisfy both, since "kafka" only resolves inside the Docker network.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.17.0
    container_name: aiops-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9201:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.17.0
    container_name: aiops-opensearch-dashboards
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5602:5601"
    depends_on:
      opensearch:
        condition: service_healthy

  # S3-compatible local object storage for the bronze data lake. MinIO's own image stopped being
  # pullable anonymously from Docker Hub/Quay/GHCR (MinIO Inc restricted free image access), so
  # this uses LocalStack's community edition (S3 only) instead - same generic AWS S3 API, no
  # application code depends on which one is running. For a real deployment, point
  # AIOPS_LAKE_ENDPOINT at real object storage (AWS S3, GCS's S3 interop, or a self-hosted MinIO
  # you pull with your own Docker Hub login) instead of this container.
  lake:
    image: localstack/localstack:3
    container_name: aiops-lake
    environment:
      SERVICES: s3
    ports:
      - "9002:4566"
    volumes:
      - aiops-lake-data:/var/lib/localstack
    healthcheck:
      # LocalStack reports s3 as "available" right after startup, then "running" once it's handled
      # its first request - match either, not just "available" (which made this healthcheck flap
      # to unhealthy as soon as the app's own first S3 call landed).
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -qE '\"s3\": *\"(available|running)\"'"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ./backend
    container_name: aiops-app
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aiops
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AIOPS_OPENSEARCH_HOST: opensearch
      AIOPS_OPENSEARCH_PORT: 9200
      AIOPS_LAKE_ENDPOINT: http://lake:4566
      AIOPS_LAKE_ACCESS_KEY: ${AIOPS_LAKE_ACCESS_KEY:-aiopsminio}
      AIOPS_LAKE_SECRET_KEY: ${AIOPS_LAKE_SECRET_KEY:-aiopsminio123}
      # Was previously undeclared here, so setting it on the host before `docker compose up` had
      # no effect on the container - the app always started with no key configured.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AIOPS_LLM_PROVIDER: ${AIOPS_LLM_PROVIDER:-openai}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      lake:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: aiops-frontend
    ports:
      - "3001:80"
    depends_on:
      - app

  # Standalone MCP server: exposes the backend's REST API as MCP tools so any MCP client (Claude
  # Desktop, Claude Code, etc.) can query/drive this platform directly. Thin HTTP proxy, no state
  # of its own - see mcp-server/README.md and ARCHITECTURE.md's MCP section for the tool list.
  mcp-server:
    build:
      context: ./mcp-server
    container_name: aiops-mcp-server
    environment:
      AIOPS_API_BASE_URL: http://app:8080/api/v1
      MCP_ALLOWED_HOSTS: localhost,127.0.0.1,mcp-server
      MCP_API_KEY: ${MCP_API_KEY:-}
    ports:
      - "8090:3000"
    depends_on:
      - app

volumes:
  aiops-postgres-data:
  aiops-lake-data:
