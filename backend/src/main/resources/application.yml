spring:
  application:
    name: aiops-agent
  profiles:
    default: local
  autoconfigure:
    # Every provider's own autoconfiguration class is excluded: Spring AI's OpenAiAutoConfiguration/
    # AnthropicAutoConfiguration both assert their API key is non-blank at bean-creation time, which
    # would crash app startup whenever that key isn't set - config.LlmConfig builds the chosen
    # provider's ChatModel/ChatClient beans itself instead, tolerating a blank key at startup and
    # only failing (with a clear error) when an agent actually tries to call the LLM. Gemini isn't
    # configured in this environment at all.
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
      - org.springframework.ai.autoconfigure.anthropic.AnthropicAutoConfiguration
      - org.springframework.ai.autoconfigure.vertexai.gemini.VertexAiGeminiAutoConfiguration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-4-5
  jackson:
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{correlationId}]"

aiops:
  llm:
    provider: ${AIOPS_LLM_PROVIDER:openai} # openai | anthropic (gemini not implemented yet)
  anomaly:
    rule:
      threshold: 10
      window-minutes: 5
    statistical:
      zscore-threshold: 2.5
      window-minutes: 5
      baseline-sample-size: 12
  approval:
    ttl-hours: 24
    expiry-check-minutes: 60
  execution:
    enabled: true
    allowed-namespaces: default
    max-per-hour: 5
    default-namespace: default
  verification:
    check-interval-minutes: 5
