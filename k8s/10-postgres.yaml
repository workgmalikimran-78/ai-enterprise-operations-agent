apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: aiops
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  strategy: { type: Recreate }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: aiops }
            - { name: POSTGRES_USER, value: aiops }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: postgres-password }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "aiops"] }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: aiops
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
