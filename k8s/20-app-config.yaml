apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-app-config
  namespace: aiops
data:
  SPRING_PROFILES_ACTIVE: local
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aiops
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  AIOPS_OPENSEARCH_HOST: opensearch
  AIOPS_OPENSEARCH_PORT: "9200"
  AIOPS_LAKE_ENDPOINT: http://lake:4566
  # Execution tools operate against the "default" namespace of THIS cluster by default - change
  # to match wherever the application deployments you want to manage actually live.
  AIOPS_EXECUTION_ALLOWED_NAMESPACES: default
  AIOPS_EXECUTION_DEFAULT_NAMESPACE: default
---
apiVersion: v1
kind: Secret
metadata:
  name: aiops-secrets
  namespace: aiops
type: Opaque
stringData:
  # Replace these before applying - do not commit real values. Prefer a secret manager
  # (e.g. External Secrets Operator, Sealed Secrets) over stringData in a real environment.
  postgres-password: "CHANGE_ME"
  openai-api-key: "CHANGE_ME"
  lake-access-key: "CHANGE_ME"
  lake-secret-key: "CHANGE_ME"
  # Shared-secret bearer token for the MCP server (16-mcp-server.yaml) - optional (that Deployment
  # marks this key `optional: true`), but several MCP tools execute real cluster mutations, so set
  # this before exposing the MCP server beyond a trusted local network.
  mcp-api-key: "CHANGE_ME"
